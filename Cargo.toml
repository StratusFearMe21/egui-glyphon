[package]
name = "egui-glyphon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cosmic-text = "0.12.1"
egui = { git = "https://github.com/StratusFearMe21/egui.git", default-features = false }
egui-wgpu = { git = "https://github.com/StratusFearMe21/egui.git", optional = true }
glyphon = { git = "https://github.com/StratusFearMe21/glyphon", branch = "grezi", optional = true }

[dev-dependencies]
eframe = { git = "https://github.com/StratusFearMe21/egui.git", features = ["wgpu"] }
env_logger = "0.11.3"

[features]
default = ["glyphon"]
glyphon = ["dep:glyphon", "dep:egui-wgpu"]
